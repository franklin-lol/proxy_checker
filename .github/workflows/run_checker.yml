name: Proxy Checker Cloud Run

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Where to get proxies?'
        required: true
        type: choice
        options:
          - 'Preset: TheSpeedX HTTP'
          - 'Preset: TheSpeedX SOCKS4'
          - 'Preset: TheSpeedX SOCKS5'
          - 'Custom URL'
      custom_url:
        description: 'Custom URL (if "Custom URL" selected above)'
        required: false
        default: ''
      proxy_type:
        description: 'Protocol to test'
        required: true
        type: choice
        options:
          - 'http'
          - 'socks4'
          - 'socks5'
          - 'all'
      limit:
        description: 'Max proxies (0 = all)'
        required: false
        default: '500'
      concurrency:
        description: 'Parallel checks (suggested: 50-100)'
        required: false
        default: '100'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Proxy Checker
        run: |
          # Resolve source
          if [ "${{ github.event.inputs.source_type }}" == "Preset: TheSpeedX HTTP" ]; then SOURCE="https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt";
          elif [ "${{ github.event.inputs.source_type }}" == "Preset: TheSpeedX SOCKS4" ]; then SOURCE="https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks4.txt";
          elif [ "${{ github.event.inputs.source_type }}" == "Preset: TheSpeedX SOCKS5" ]; then SOURCE="https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt";
          else SOURCE="${{ github.event.inputs.custom_url }}"; fi
          
          if [ -z "$SOURCE" ]; then echo "Error: No source provided"; exit 1; fi

          # Force rich to use colors in GitHub Actions
          export FORCE_COLOR=1
          
          python proxy_checker.py \
            --url "$SOURCE" \
            --type "${{ github.event.inputs.proxy_type }}" \
            --limit ${{ github.event.inputs.limit }} \
            --concurrency ${{ github.event.inputs.concurrency }} \
            --export txt \
            --out ./results

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: working-proxies
          path: ./results/*.txt
